<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{kauris/layout :: page(titre='Mon compte', contenu=~{::section})}">
<body>
<section>
    <p>Vous êtes connecté avec <strong th:text="${kauris.personne().email()}">email</strong>.</p>
    <h2>Changer mon mot de passe</h2>
    <form class="k-pile" method="post" th:action="@{/compte/mot-de-passe}">
        <label>Mot de passe actuel
            <input name="actuel" type="password" required autocomplete="current-password">
        </label>
        <label>Nouveau mot de passe (10 caractères au moins)
            <input name="nouveau" type="password" required minlength="10" maxlength="128"
                   autocomplete="new-password">
        </label>
        <button type="submit" class="k-bouton">Changer</button>
    </form>
</section>
</body>
</html>
