<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/kauris/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <title>Installation · Kauris</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F5F5;
            font-family: -apple-system, "Segoe UI", Arial, sans-serif; color: #1E1E1E; }
        main { width: min(92vw, 400px); background: #fff; border: 1px solid #E2E2E2; border-radius: 10px;
            padding: 2rem 1.75rem; }
        h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.02em; text-align: center; }
        p { margin: 0 0 1.5rem; color: #767676; font-size: 14px; text-align: center; }
        label { display: block; font-size: 13px; font-weight: 600; margin: .9rem 0 .3rem; }
        input { width: 100%; box-sizing: border-box; border: 1.5px solid #ccc; border-radius: 6px;
            padding: .6rem .7rem; font-size: 15px; }
        .aide { color: #767676; font-size: 12px; margin-top: .25rem; }
        .message { border-radius: 6px; padding: .7rem .9rem; margin-bottom: 1rem; font-size: 14px; }
        .message.ko { background: #fdecef; color: #e0244a; }
        .message.ok { background: #e8fdf1; color: #02a84b; }
        button { width: 100%; margin-top: 1.4rem; background: #03C75A; color: #fff; font-weight: 700; border: 0;
            border-radius: 6px; padding: .8rem 1rem; font-size: 15px; cursor: pointer; }
        button:hover { background: #02a84b; }
    </style>
</head>
<body>
<main>
    <h1>Bienvenue dans Kauris</h1>
    <p>Premier démarrage : créez votre organisation et votre compte de propriétaire.</p>
    <div class="message ko" th:if="${erreur}" th:text="${erreur}">Erreur</div>
    <form method="post" th:action="@{/installation}">
        <label for="nomOrganisation">Nom de l'organisation</label>
        <input id="nomOrganisation" name="nomOrganisation" th:value="${saisie.nomOrganisation()}" required
               maxlength="120" autofocus>
        <label for="nomEtablissement">Premier établissement</label>
        <input id="nomEtablissement" name="nomEtablissement" th:value="${saisie.nomEtablissement()}"
               maxlength="120" placeholder="Siège">
        <label for="nom">Votre nom</label>
        <input id="nom" name="nom" th:value="${saisie.nom()}" required maxlength="120" autocomplete="name">
        <label for="email">Votre adresse email</label>
        <input id="email" name="email" type="email" th:value="${saisie.email()}" required maxlength="190"
               autocomplete="username">
        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" name="motDePasse" type="password" required minlength="10" maxlength="128"
               autocomplete="new-password">
        <div class="aide">10 caractères au moins.</div>
        <button type="submit">Installer Kauris</button>
    </form>
</main>
</body>
</html>
