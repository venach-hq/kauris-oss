# Réglages communs à tous les environnements. AUCUN secret ici : ils viennent des variables d'environnement.
# Choix de l'environnement : SPRING_PROFILES_ACTIVE=dev (par défaut) ou prod.
spring:
  application:
    name: kauris-standalone
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma appartient à Flyway : Hibernate vérifie seulement qu'il correspond aux entités.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # Chaque module apporte ses migrations dans db/migration/<module>/.
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  application:
    name: '@project.name@'
    version: '@project.version@'

# Documents : dossier des polices TrueType (« Famille-Style.ttf », par exemple Poppins-Bold.ttf). Vide : les
# documents utilisent les polices de base du PDF (Helvetica, Times, Courier).
kauris:
  documents:
    polices: ${KAURIS_POLICES:}
  # Liens « Aide » et « Code source » de chaque page. Vides : le guide et le dépôt officiels. Une version modifiée
  # mise à disposition par le réseau indique son propre dépôt (licence AGPL-3.0).
  ui:
    guide: ${KAURIS_GUIDE:}
    code-source: ${KAURIS_CODE_SOURCE:}
