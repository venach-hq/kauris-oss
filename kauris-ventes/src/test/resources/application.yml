# Tests des ventes : la base est un MySQL jetable lancé par Testcontainers (adresse fournie par le test).
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

# Dans les tests, le relais de la boîte d'envoi ne passe que quand le test le demande.
kauris:
  notifications:
    relais:
      actif: false
