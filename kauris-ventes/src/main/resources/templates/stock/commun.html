<!DOCTYPE html>
<!-- Morceaux communs aux écrans du stock : onglets et style. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="navigation">
    <style>
        .s-onglets { display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 1.2rem; border-bottom: 1px solid var(--k-bord); }
        .s-onglets a { padding: .45rem .8rem; text-decoration: none; color: var(--k-texte); font-weight: 600; font-size: 14px; }
        .s-onglets a.s-actif { box-shadow: inset 0 -3px 0 var(--k-vert); color: var(--k-vert-fonce); }
        .s-chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .8rem; margin: 0 0 1rem; }
        .s-chiffre { border: 1px solid var(--k-bord); border-radius: 8px; padding: .7rem 1rem; background: var(--k-carte); }
        .s-chiffre span { display: block; font-size: 12px; color: var(--k-discret); text-transform: uppercase; letter-spacing: .04em; }
        .s-chiffre strong { font-size: 1.3rem; }
        .s-chiffre.s-alerte strong { color: var(--k-rouge); }
        .s-nombre { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .s-boutons { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; align-items: center; }
        .s-boutons form { margin: 0; }
        .s-filtres { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; margin: 0 0 1rem; }
        .s-filtres label { display: grid; gap: .2rem; font-size: 13px; font-weight: 600; }
        .s-negatif { color: var(--k-rouge); font-weight: 700; }
        .s-entree { color: #0B7A3B; }
        .s-sortie { color: #B3261E; }
    </style>
    <nav class="s-onglets" aria-label="Stock">
        <a th:href="@{/stock}" th:classappend="${onglet == 'etat'} ? 's-actif'">État du stock</a>
        <a th:href="@{/stock/mouvement}" th:if="${droits.mouvementer()}" th:classappend="${onglet == 'saisie'} ? 's-actif'">Entrée ou sortie</a>
        <a th:href="@{/stock/transfert}" th:if="${droits.mouvementer() and depots.size() > 1}" th:classappend="${onglet == 'transfert'} ? 's-actif'">Transfert</a>
        <a th:href="@{/stock/inventaire}" th:if="${droits.mouvementer()}" th:classappend="${onglet == 'inventaire'} ? 's-actif'">Inventaire</a>
        <a th:href="@{/stock/mouvements}" th:classappend="${onglet == 'mouvements'} ? 's-actif'">Mouvements</a>
        <a th:href="@{/stock/depots}" th:classappend="${onglet == 'depots'} ? 's-actif'">Dépôts</a>
    </nav>
</th:block>
</body>
</html>
