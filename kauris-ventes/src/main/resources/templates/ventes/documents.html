<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{kauris/layout :: page(titre=${type == null ? 'Documents de vente' : (type.name() == 'DEVIS' ? 'Devis' : type.libelle() + 's')}, contenu=~{::section})}">
<body>
<section>
    <th:block th:replace="~{ventes/commun :: navigation}"></th:block>

    <div class="v-boutons" th:if="${droits.saisir() and (type == null or type.name() != 'AVOIR')}">
        <a class="k-bouton" th:href="@{/ventes/documents/nouveau(type=${type == null ? 'FACTURE' : type.name()})}"
           th:text="${type != null and type.name() == 'DEVIS' ? 'Nouveau devis' : 'Nouvelle facture'}">Nouvelle facture</a>
    </div>
    <p class="k-discret" th:if="${type != null and type.name() == 'AVOIR'}">Un avoir se fait depuis la facture qu'il
        corrige (bouton « Faire un avoir » sur la facture).</p>

    <form class="v-recherche" method="get" th:action="@{/ventes/documents}">
        <input type="hidden" name="type" th:value="${type == null ? '' : type.name()}">
        <label>Rechercher <input name="q" th:value="${q}" placeholder="N°, client, objet" maxlength="80"></label>
        <label>Du <input type="date" name="du" th:value="${du}"></label>
        <label>Au <input type="date" name="au" th:value="${au}"></label>
        <button type="submit" class="k-bouton k-secondaire">Chercher</button>
    </form>

    <p class="k-discret" th:if="${documents.isEmpty()}">Aucun document.</p>
    <table class="k-table" th:unless="${documents.isEmpty()}">
        <thead><tr><th>Document</th><th>Date</th><th>Client</th><th>Objet</th><th class="v-montant">Total</th>
            <th class="v-montant" th:if="${type == null or type.name() == 'FACTURE'}">Reste</th><th>Situation</th></tr></thead>
        <tbody>
        <tr th:each="d : ${documents}">
            <td><a th:href="@{/ventes/documents/{id}(id=${d.id()})}" th:text="${d.intitule()}">Facture FA-2026-0001</a></td>
            <td th:text="${f.jour(d.contenu().date())}">01/11/2026</td>
            <td th:text="${d.client().nom()}">Client</td>
            <td th:text="${d.contenu().objet()}">Objet</td>
            <td class="v-montant" th:text="${f.montant(d.totaux().totalTtc())}">0</td>
            <td class="v-montant" th:if="${type == null or type.name() == 'FACTURE'}"
                th:text="${d.type().name() == 'FACTURE' and !d.modifiable() ? f.montant(d.resteAPayer()) : ''}">0</td>
            <td><span th:replace="~{ventes/commun :: situation(${d.situation(aujourdHui)})}"></span></td>
        </tr>
        </tbody>
    </table>
    <p class="k-discret" th:if="${documents.size() >= 300}">Les 300 plus récents sont affichés : précisez la recherche.</p>
</section>
</body>
</html>
