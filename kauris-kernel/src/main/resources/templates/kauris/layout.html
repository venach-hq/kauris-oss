<!DOCTYPE html>
<!--
  Gabarit commun à tous les écrans de Kauris. Une page l'utilise ainsi :

  <html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{kauris/layout :: page(titre='Mon écran', contenu=~{::section})}">
  <body><section> … </section></body>
  </html>

  Le modèle contient toujours « kauris » (personne connectée, organisation, menu) ; « succes » et « erreur »
  sont les messages d'une action qui vient d'être faite.
-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="page(titre, contenu)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre + ' · Kauris'}">Kauris</title>
    <link rel="stylesheet" th:href="@{/kauris/kauris.css}">
</head>
<body>
<header class="k-entete">
    <a class="k-marque" th:href="@{/}">Kauris</a>
    <span class="k-organisation" th:if="${kauris != null and kauris.acces() != null}"
          th:text="${kauris.acces().organisation()}">Organisation</span>
    <form class="k-changer" method="post" th:action="@{/organisation/choisir}"
          th:if="${kauris != null and !kauris.autresAcces().isEmpty()}">
        <label class="k-discret" for="k-organisation">Changer :</label>
        <select id="k-organisation" name="organisation" onchange="this.form.submit()">
            <option value="" selected disabled>autre organisation…</option>
            <option th:each="a : ${kauris.autresAcces()}" th:value="${a.tenantId()}"
                    th:text="${a.organisation()}">Autre</option>
        </select>
        <noscript><button type="submit">OK</button></noscript>
    </form>
    <span class="k-espace"></span>
    <form class="k-personne" method="post" th:action="@{/logout}" th:if="${kauris != null}">
        <span th:text="${kauris.nomAffiche()}">Nom</span>
        <button type="submit" class="k-bouton k-secondaire">Se déconnecter</button>
    </form>
</header>
<nav class="k-menu" th:if="${kauris != null and !kauris.menu().isEmpty()}" aria-label="Menu principal">
    <a th:each="e : ${kauris.menu()}" th:href="@{${e.chemin()}}" th:text="${e.libelle()}">Entrée</a>
</nav>
<main class="k-contenu">
    <h1 th:text="${titre}">Titre</h1>
    <div class="k-message k-ok" role="status" th:if="${succes}" th:text="${succes}">Fait.</div>
    <div class="k-message k-ko" role="alert" th:if="${erreur}" th:text="${erreur}">Refusé.</div>
    <th:block th:replace="${contenu}"/>
</main>
</body>
</html>
