# La CI n'appelle que le Makefile : le même contrôle tourne à l'identique sur un poste, un serveur
# ou une autre forge (Forgejo Actions lit ce même format).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique, pour la recherche de secrets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilation et tests
        run: make verify
      # Les PDF d'exemple produits par les tests, pour les regarder (onglet « Artifacts » de l'exécution).
      - name: Documents d'exemple
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-exemple
          path: |
            kauris-kernel/target/documents-exemple/
            kauris-ventes/target/documents-exemple/
          if-no-files-found: ignore
          retention-days: 14
      - name: Recherche de secrets
        run: make secrets

  # L'image Docker se construit (sans être publiée) : le Dockerfile ne casse pas en silence.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: make image
