# Publication d'une version : une étiquette « v0.1.0 » poussée sur main.
#   git tag v0.1.0 && git push origin v0.1.0
# → tests, jar du mode autonome attaché à la version GitHub, image ghcr.io/venach-hq/kauris:0.1.0 et :latest.
name: publication

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kauris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Version des modules
        run: make version VERSION="$VERSION"
      - name: Tests
        run: make verify
      - name: Connexion au registre d'images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Image
        run: make publier-image IMAGE="$IMAGE" VERSION="$VERSION"
      - name: Version GitHub avec le jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp kauris-standalone/target/kauris-standalone.jar kauris-"$VERSION".jar
          cp deploy/.env.example kauris.env.example
          gh release create "$GITHUB_REF_NAME" kauris-"$VERSION".jar deploy/docker-compose.yml kauris.env.example \
            --title "Kauris $VERSION" --generate-notes
